name: Installeur Windows

# Construit l'installeur sur une vraie machine Windows : ffmpeg-static et
# ffprobe y téléchargent les binaires Windows. Une étiquette vX.Y.Z, ou un
# lancement manuel avec « publier » coché, publie une version GitHub
# (étiquette v<version de package.json> créée au besoin) avec l'installeur.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier une version GitHub"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Vérifier que FFmpeg est bien embarqué
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem -Recurse release/win-unpacked -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Recurse release/win-unpacked -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "ffmpeg.exe ou ffprobe.exe absent du paquet" }
          & $ffmpeg.FullName -version | Select-Object -First 1
          & $ffprobe.FullName -version | Select-Object -First 1
      - uses: actions/upload-artifact@v4
        with:
          name: KEAPlayer-Setup
          path: release/*.exe
          if-no-files-found: error
      - name: Version à publier
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          name: KEAPlayer ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*.exe
          generate_release_notes: true
